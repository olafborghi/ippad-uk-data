project:
  type: website
  output-dir: _site
  # site data read by the explorer and the data page in the browser
  resources:
    - "data/*.csv"
  # the data build script and the insight template are not site pages
  render:
    - "*.qmd"
    - "!scripts/"
    - "!insights/_template.qmd"
    - "!CLAUDE.md"
    - "!README.md"
    - "!LICENSE.md"

lang: en-GB

execute:
  # pages only re-run when their source changes, so publishing needs no R
  freeze: auto
  echo: false
  warning: false
  message: false

website:
  title: "IP-PAD UK Data"
  site-url: "https://olafborghi.com/ippad-uk-data"
  repo-url: "https://github.com/olafborghi/ippad-uk-data"
  description: "Findings and data from four surveys of young people aged 12 to 26 in the United Kingdom, carried out between 2024 and 2026 as part of the IP-PAD Doctoral Network."
  favicon: assets/logo.png
  page-navigation: false
  navbar:
    title: "IP-PAD UK Data"
    left:
      - text: "Data"
        href: data.qmd
      - text: "Explore"
        href: explore.qmd
      - text: "Insights"
        href: insights/index.qmd
      - text: "About"
        href: about.qmd
    # the IP-PAD logo on the right links to the project website; the logo
    # itself is drawn by .ippad-link in assets/styles.scss
    right:
      - href: https://www.ippad.eu
        text: '<span class="ippad-link">IP-PAD project website</span>'
  page-footer:
    left: |
      [![European Commission](/assets/ec-logo-horiz_en.png){height=30px} ![UK Research and Innovation](/assets/UKRI_Logo.jpg){height=30px}]{.funder-logos} [Funded by the European Union (Grant Agreement No. 101072992) and UKRI (EPSRC EP/X026825/1). [Funding details](/about.qmd#funding)]{.funder-text}
    right: |
      Data and text under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/) · Built with [Claude Code](https://claude.com/claude-code)

format:
  html:
    theme: [brand, assets/styles.scss]
    # contents on the right of inner pages; the home, explore and insights
    # listing pages switch it off in their front matter
    toc: true
    toc-location: right
    toc-depth: 2
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: true
    fig-align: left
    fig-responsive: true

knitr:
  opts_chunk:
    dev: "ragg_png"
    fig.retina: 2
    fig.align: "left"
